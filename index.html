<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary</title>
    <style>
        :root {
    --bg-dark: #1a171d;
    --bg-card: #28232d;
    --text-muted: #a899bc;
    --accent-soft: #977eb6;
    --accent-primary: #935cd8;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-muted);
    font-family: sans-serif;
    margin: 0;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

header {
    text-align: center;
    margin-bottom: 30px;
    width: 100%;
    max-width: 700px;
}

h1 {
    color: var(--accent-primary);
    margin: 0 0 5px 0;
}

p {
    margin-top: 0;
    color: var(--accent-soft);
}

#searchInput {
width: 100%;
padding: 12px 15px;
margin-top: 20px;
background-color: var(--bg-card);
border: 1px solid var(--accent-soft);
color: #fff;
border-radius: 8px;
outline: none;
box-sizing: border-box;
font-size: 16px;
transition: all 0.3s;
}

#searchInput:focus {
border-color: var(--accent-primary);
box-shadow: 0 0 8px rgba(147, 92, 216, 0.4);
}

#diaryContainer {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
gap: 15px;
width: 100%;
max-width: 700px;
}

.diary-btn {
    background-color: var(--bg-card);
    color: var(--text-muted);
    border: 1px solid var(--accent-soft);
    padding: 15px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    text-align: left;
    transition: all 0.2s ease;
}

.diary-btn:hover {
    background-color: var(--accent-primary);
    color: var(--bg-dark);
    border-color: var(--accent-primary);
    transform: translateY(-2px);
}

/* --- Styling Modal --- */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(26, 23, 29, 0.85); /* transparan dikit */
    backdrop-filter: blur(4px);
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    z-index: 1000;
}

.modal-content {
    background-color: var(--bg-card);
    border: 1px solid var(--accent-primary);
    border-radius: 12px;
    padding: 25px;
    width: 100%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

#modalTitle {
color: var(--accent-primary);
margin-top: 0;
border-bottom: 1px solid var(--accent-soft);
padding-bottom: 15px;
padding-right: 30px;
}

#modalBody {
color: var(--text-muted);
line-height: 1.7;
white-space: pre-wrap; /* Mempertahankan enter/spasi dari .txt */
}

.close-btn {
    position: absolute;
    top: 20px;
    right: 25px;
    color: var(--accent-soft);
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.2s;
}

.close-btn:hover {
    color: var(--accent-primary);
}

    </style>
</head>
<body>
    <header>
        <h1>Diary</h1>
        <p>Catatan, memori, dan hal-hal random</p>
        <input type="text" id="searchInput" placeholder="Cari judul diary...">
    </header>

    <main id="diaryContainer"></main>

    <!-- Modal Box untuk menampilkan isi .txt -->
    <div id="diaryModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Masukan Teks</h2>
            <div id="modalBody">Memuat isi diary...</div>
        </div>
    </div>

    <!-- ENTRIES -->
    <script>
        // Kalau ada diary baru, tambahkan di bawah sini aja ya.
        const diaryEntries = [
            { title: "Hari Pertama Belajar Godot", file: "2026-09-godot.txt" },
            { title: "Review Zorin OS", file: "2026-08-zorin.txt" },
            { title: "Bikin Web Profile", file: "2026-09-profile.txt" }
        ];
    </script>
    <script>
        const container = document.getElementById('diaryContainer');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('diaryModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeBtn = document.querySelector('.close-btn');

        // Merender tombol ke HTML
        function renderButtons(entries) {
            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = '<p style="text-align:center; width:100%;">Tidak ada judul yang cocok.</p>';
            return;
            }

            entries.forEach(entry => {
                const btn = document.createElement('button');
                btn.className = 'diary-btn';
                btn.textContent = entry.title;
                btn.onclick = () => openModal(entry);
                container.appendChild(btn);
            });
        }

        // Buka modal dan ambil isi .txt dari direktori assets/text/
        async function openModal(entry) {
        modalTitle.textContent = entry.title;
        modalBody.textContent = "Memuat isi diary...";
        modal.style.display = 'flex'; // Tampilkan modal

            try {
                const response = await fetch(`assets/text/${entry.file}`);
                if (!response.ok) throw new Error('File tidak ditemukan');

                const text = await response.text();
                modalBody.textContent = text;
            }
                catch (error) {
                    modalBody.textContent = `Gagal memuat. Pastikan file "${entry.file}" ada di dalam folder "assets/text/".`;
                }
        }

        // Tutup modal ketika tombol X ditekan
        closeBtn.onclick = () => {
            modal.style.display = 'none';
        };

        // Tutup modal ketika area luar modal diklik
        window.onclick = (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        };

        // Fitur Search berdasarkan judul
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = diaryEntries.filter(entry =>
            entry.title.toLowerCase().includes(keyword)
            );
            renderButtons(filtered);
        });

        // Jalankan saat pertama kali web dimuat
        renderButtons(diaryEntries);
    </script>
</body>
</html>
